<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Lun_term — терминал с лунной лентой</title>
  <link rel="stylesheet" href="/css/style.css?v=58" />
</head>
<body>
  <header class="menubar">
    <div class="menu"><button class="menu-btn">🎯 Инструменты ▾</button><div class="menu-drop scroll"><div id="instruments" class="btns"></div></div></div>
    <div class="menu"><button class="menu-btn">⏱ ТФ ▾</button><div class="menu-drop"><div id="timeframes" class="btns"></div></div></div>
    <div class="menu"><button class="menu-btn">🗓 Период ▾</button><div class="menu-drop"><div id="history" class="btns"></div></div></div>
    <div class="menu"><button class="menu-btn">📈 Индикаторы ▾</button><div class="menu-drop scroll"><div id="indicators" class="btns"></div></div></div>
    <div class="menu"><button class="menu-btn">✏️ Рисование ▾</button><div class="menu-drop"><div id="drawtools" class="btns"></div></div></div>
    <div class="menu"><button class="menu-btn">🌙 Астро ▾</button><div class="menu-drop scroll">
      <div class="menu-sub">Циклы</div><div id="cycles" class="btns"></div>
      <div class="menu-sub">Планеты / аспекты</div><div id="aspects" class="btns"></div>
    </div></div>
    <div class="menu"><button class="menu-btn">📐 Ганн ▾</button><div class="menu-drop scroll"><div id="gann" class="btns"></div></div></div>
    <div class="menu"><button class="menu-btn">🔌 Коннекторы ▾</button><div class="menu-drop"><div id="connectors" class="btns"></div></div></div>
    <div class="menu"><button class="menu-btn">⚙️ Настройки ▾</button><div class="menu-drop"><div id="settings" class="btns"></div></div></div>
    <div class="menu"><button class="menu-btn">🔔 Алерты ▾</button><div class="menu-drop"><div class="menu-note">Алерты — следующий этап</div></div></div>
    <span class="spacer"></span>
    <div class="menu"><button class="menu-btn">▦ Экраны ▾</button><div class="menu-drop" id="layouts-drop"><div id="layouts" class="btns"></div></div></div>
  </header>

  <div id="sym-title" class="sym-title"></div>
  <main id="chart"></main>

  <footer class="statusbar">
    <span id="moon-now">☾ …</span>
    <span class="spacer"></span>
    <span id="stream-status" style="color:#6b7280">поток: выкл</span>
    <span>Данные: <b id="datasource">загрузка…</b></span>
  </footer>

  <!-- вендор-библиотеки (локально, без CDN) -->
  <script src="/vendor/klinecharts.min.js"></script>
  <script src="/vendor/astronomy.browser.min.js"></script>
  <!-- код приложения (порядок важен). ?v= — сброс кэша при обновлении. -->
  <script src="/js/config.js?v=58"></script>
  <script src="/js/settings.js?v=58"></script>
  <script src="/js/astro.js?v=58"></script>
  <script src="/js/ts-astro.js?v=58"></script>
  <script src="/js/markov.js?v=58"></script>
  <script src="/js/indicators.js?v=58"></script>
  <script src="/js/overlays.js?v=58"></script>
  <script src="/js/iss-client.js?v=58"></script>
  <script src="/js/providers/base.js?v=58"></script>
  <script src="/js/providers/crypto.js?v=58"></script>
  <script src="/js/providers/yahoo.js?v=58"></script>
  <script src="/js/instruments.js?v=58"></script>
  <script src="/js/data.js?v=58"></script>
  <script src="/js/stream.js?v=58"></script>
  <script src="/js/backtest.js?v=58"></script>
  <script src="/js/app.js?v=58"></script>
</body>
</html>
